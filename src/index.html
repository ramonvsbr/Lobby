<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lobby</title>
<meta name="theme-color" content="#ECEBE3">
<script>document.documentElement.setAttribute('data-theme','light');</script>
<style>html,body{background:#ECEBE3}</style>
<link rel="preload" href="fonts/Fredoka.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="fonts/PlusJakartaSans.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="shared/theme.css">
<style>
@font-face{font-family:'Plus Jakarta Sans';src:url('fonts/PlusJakartaSans.ttf') format('truetype');font-weight:200 800;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,.p-title,.ring b,.app b,.hh,.st b,.act,.back{font-family:var(--font-display)}
#hub{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:16px}

/* ---- cenário no topo: o próprio .top vira o cabeçalho ilustrado ---- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  margin:calc(-1 * (env(safe-area-inset-top,0px) + 18px)) -18px 0;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 20px;
  min-height:calc(132px + env(safe-area-inset-top,0px));
  color:#fff;border-radius:0 0 var(--radius-lg) var(--radius-lg);
  background:url(shared/img/hero-hub.webp) 12% center/cover no-repeat,var(--band)}
.top > div{display:none}              /* saudação e data ocultas: o cenário ocupa o cabeçalho */
.top .ibtn{margin-left:auto}
.top h1{margin:0;font-size:30px;font-weight:600;line-height:1.1;text-shadow:0 2px 0 rgba(31,51,40,.35)}
.top small{display:block;margin-top:4px;color:rgba(255,255,255,.88);font-size:13px;font-weight:600}
.top small::first-letter{text-transform:uppercase}
.ibtn{width:44px;height:44px;border-radius:50%;background:rgba(248,247,242,.94);color:var(--text);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);display:grid;place-items:center}
.ibtn:active{transform:translateY(2px);box-shadow:none}
.ibtn svg,.ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* ---- cartões: objeto com "degrau" ---- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--lift);padding:18px}
.card h2{margin:0 0 12px;font-size:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}

/* ---- jogador: anel de nível ---- */
.player{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:var(--gold);transition:stroke-dashoffset .9s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:600;color:var(--gold-ink)}
.p-title{font-size:21px;font-weight:600;letter-spacing:0}
.p-sub{color:var(--text-muted);font-size:13px;margin:2px 0 10px}
.bar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .9s var(--ease);
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 8px,transparent 8px 16px);background-size:22px 22px;animation:stripes 1.4s linear infinite}

/* ---- semana ---- */
.week{display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:2px dashed var(--line-soft)}
.day{display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-faint)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.dot.on{background:var(--gold);border-color:#B98419;color:var(--gold-ink)} .dot.today{border-color:var(--text);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line-strong)}
.dot svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.streak{font-weight:800;color:var(--text)}

/* ---- missões ---- */
.q{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px dashed var(--line-soft)}
.q:first-of-type{border-top:0;padding-top:0}
.chk{width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface-2);display:grid;place-items:center;flex:none}
.q.done .chk{background:var(--moss);border-color:#2F6139;color:var(--chalk-ink);animation:pop .35s var(--pop)}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.q .t{flex:1;min-width:0} .q .t b{display:block;font-weight:700}
.q .t span{font-size:13px;color:var(--text-muted)}
.q.done .t b{color:var(--text-muted);text-decoration:line-through}
.xp{font-size:12px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);border-radius:99px;padding:4px 10px}
.q.done .xp{color:var(--gold-ink)}
.act{height:42px;padding:0 16px;border-radius:var(--radius);background:var(--chalk);color:var(--chalk-ink);font-size:16px;font-weight:600;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.act:active{transform:translateY(3px);box-shadow:none}
.all{margin-top:12px;text-align:center;font-family:var(--font-display);font-weight:600;color:var(--moss);font-size:16px}

/* ---- cartões dos apps ---- */
.apps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.app{border-radius:var(--radius-lg);padding:16px;text-align:left;display:grid;gap:14px;min-height:140px;align-content:space-between;border:2px solid var(--line);box-shadow:var(--lift);transition:transform .12s var(--ease),box-shadow .12s var(--ease)}
.app:active{transform:translateY(3px);box-shadow:none}
.app[data-go="maromba"]{background:var(--tile-green) !important;border-color:var(--chalk-dim);box-shadow:0 4px 0 var(--chalk-dim)}
.app[data-go="saldo"]{background:var(--gold-soft) !important;border-color:#E3C375;box-shadow:0 4px 0 #E3C375}
.app:active{box-shadow:none !important}
.app .ico{width:48px;height:48px;border-radius:16px;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center}
.app b{display:block;font-size:19px;font-weight:600}
.app span{display:block;font-size:13px;color:var(--text-muted);margin-top:2px}
.link{font-weight:700;color:var(--text);text-transform:none;letter-spacing:0;font-size:13px}

/* ---- aviso e janela ---- */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:18px;font-weight:600;display:flex;gap:14px;align-items:center;transition:.25s var(--ease);max-width:90vw;z-index:30;border:2px solid var(--chalk)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:800;color:var(--gold)}
#sheet{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#sheet.on{opacity:1;pointer-events:auto}
#sheet .pn{background:var(--surface);width:100%;max-width:520px;margin:0 auto;border:2px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(40px);transition:transform .25s var(--ease);max-height:80vh;overflow:auto}
#sheet.on .pn{transform:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;padding:14px 6px;border-radius:20px;background:var(--gold-soft);border:2px solid #E3C375;display:grid;gap:4px;justify-items:center}
.bd .e{font-size:28px;line-height:1} .bd b{font-size:12px;font-weight:700} .bd span{font-size:11px;color:var(--text-muted)}
.bd.lock{background:var(--surface-2);border-color:var(--line);filter:grayscale(1);opacity:.55}
.hh{margin:0 0 14px;font-size:20px;font-weight:600}

/* ---- tela "Como funciona" ---- */
#ajuda{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;transform:translateX(100%);visibility:hidden;transition:transform .28s var(--ease),visibility 0s .28s}
#ajuda.on{transform:none;visibility:visible;transition:transform .28s var(--ease)}
.ah{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 14px;background:var(--band);color:var(--band-ink);border-radius:0 0 22px 22px}
.ah h2{margin:0;font-size:20px;font-weight:600}
.back{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:99px;background:rgba(248,247,242,.94);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);color:var(--text-muted);font-size:14px;font-weight:600}
.back:active{transform:translateY(2px);box-shadow:none}
.ac{max-width:520px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 32px);display:grid;gap:16px}
.sec{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--lift);padding:18px}
.sec h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.hs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.st{text-align:center} .st b{display:block;font-size:30px;font-weight:600;color:var(--gold-ink)} .st span{font-size:12px;font-weight:700;color:var(--text-muted)}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed var(--line-soft)}
.li:first-of-type{border-top:0;padding-top:0}
.li .em{width:40px;height:40px;border-radius:14px;background:var(--tile-yellow);display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.li .tx{flex:1;min-width:0} .li .tx b{display:block;font-size:14px;font-weight:700} .li .tx span{font-size:13px;color:var(--text-muted)}
.li.cur{background:var(--gold-soft);border-radius:16px;padding:10px;margin:2px -10px;border-top-color:transparent}
.pill{font-size:12px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);border-radius:99px;padding:4px 10px;white-space:nowrap}
.pill.ok{color:var(--moss);background:var(--moss-soft)}
.mini{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px} .mini.big{height:12px;margin-top:0}
.mini i{display:block;height:100%;background:var(--gold);border-radius:99px}
.nt{font-size:13px;color:var(--text-muted);margin:12px 0 0} .tp{font-size:14px;margin:0}
</style>
</head>
<body>
<main id="hub"></main>
<div id="toast" role="status"></div>
<div id="ajuda" aria-label="Como funciona"></div>
<div id="sheet"><div class="pn" id="sheet-body"></div></div>
<script src="hub.js"></script>
</body>
</html>
